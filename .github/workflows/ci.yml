# Lint and unit tests on every push and pull request. The broker integration tests
# (`pnpm test:broker`) need the Podman dev Broker and run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! expects the frontend build output to exist.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Generated types match the Rust types
        run: |
          pnpm types
          if [ -n "$(git status --porcelain -- src/generated src/processing/generated)" ]; then
            git status --porcelain -- src/generated src/processing/generated
            echo "The generated types are out of date: run pnpm types and commit them."
            exit 1
          fi
