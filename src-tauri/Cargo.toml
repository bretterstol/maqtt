[package]
name = "maqtt"
version = "0.1.0"
description = "A desktop MQTT client for exploring and debugging live traffic on several Brokers at once"
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "maqtt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
rumqttc = { workspace = true, features = ["use-rustls"] }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
keyring = "4.2.0"
directories = "6.0.0"
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4"] }
rustls = "0.23"
rustls-native-certs = "0.8"
tauri-plugin-dialog = "2"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
