<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- mÅqtt: the Å as a broadcast mast on the petrol panel, its ring sending lamp-amber waves -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1b4452"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#panel)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#2a4c57" stroke-width="6"/>

  <!-- Waves leaving the ring on both sides, with a soft glow like an indicator -->
  <g stroke="#f0a53a" stroke-width="40" stroke-linecap="round" fill="none">
    <g filter="url(#glow)" opacity="0.55">
      <path d="M604 173 A 120 120 0 0 1 604 327"/>
      <path d="M420 173 A 120 120 0 0 0 420 327"/>
    </g>
    <path d="M604 173 A 120 120 0 0 1 604 327"/>
    <path d="M420 173 A 120 120 0 0 0 420 327"/>
    <g opacity="0.6">
      <path d="M658 128 A 190 190 0 0 1 658 372"/>
      <path d="M366 128 A 190 190 0 0 0 366 372"/>
    </g>
  </g>

  <!-- The ring of the Å -->
  <circle cx="512" cy="250" r="56" fill="none" stroke="#e3ecea" stroke-width="40"/>

  <!-- The A, as the mast -->
  <g stroke="#e3ecea" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 860 L 512 395 L 724 860"/>
    <path d="M395 690 H 629"/>
  </g>
</svg>
