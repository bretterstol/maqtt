<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf0"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- Broadcast waves from the root: messages arriving -->
  <g stroke="#9ecbff" stroke-width="40" stroke-linecap="round" fill="none">
    <path d="M330 170 A 160 160 0 0 1 490 330"/>
    <path d="M330 100 A 230 230 0 0 1 560 330" opacity="0.7"/>
  </g>
  <!-- The topic tree -->
  <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M330 400 V 780"/>
    <path d="M330 520 H 560"/>
    <path d="M330 650 H 560"/>
    <path d="M330 780 H 560"/>
  </g>
  <!-- The root as the ring of the å -->
  <circle cx="330" cy="330" r="62" fill="none" stroke="#ffffff" stroke-width="40"/>
  <g fill="#ffffff">
    <rect x="600" y="490" width="250" height="60" rx="30"/>
    <rect x="600" y="620" width="190" height="60" rx="30"/>
    <rect x="600" y="750" width="220" height="60" rx="30" opacity="0.75"/>
  </g>
</svg>
