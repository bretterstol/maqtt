[package]
publish = false
name = "trafficgen"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde_json = { workspace = true }
rumqttc = { version = "0.25.1", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
