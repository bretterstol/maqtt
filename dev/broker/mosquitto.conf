# Dev Broker for måqtt. One listener per way a Broker Profile can reach a Broker.
# Credentials and certificates are generated by dev/env.sh into dev/broker/generated/.
# Container ports below; dev/env.sh publishes them on the host as 21883, 21884, 28883, 28884.

# Deprecated in Mosquitto 2.1 but still the simplest way to give each listener its own
# password file; the image is pinned to major version 2.
per_listener_settings true
log_dest stdout
log_type error
log_type warning
log_type notice

persistence false

# Plain TCP, anonymous.
listener 1883
listener_allow_anonymous true

# Plain TCP, username/password (maqtt / maqtt).
listener 1884
listener_allow_anonymous false
password_file /mosquitto/generated/passwd

# TLS with a self-signed CA, username/password (maqtt / maqtt).
listener 8883
listener_allow_anonymous false
password_file /mosquitto/generated/passwd
cafile /mosquitto/generated/ca.crt
certfile /mosquitto/generated/server.crt
keyfile /mosquitto/generated/server.key

# Mutual TLS: the client certificate's CN is the username.
listener 8884
listener_allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/generated/ca.crt
certfile /mosquitto/generated/server.crt
keyfile /mosquitto/generated/server.key
